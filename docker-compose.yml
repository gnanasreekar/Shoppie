services:
  postgres:
    image: postgres:16-alpine
    container_name: shoppie-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shoppie
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
